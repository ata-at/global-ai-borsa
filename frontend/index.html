<!doctype html>
<html lang="tr">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#0e1118">
    <title>Global AI Borsa</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { 
            background: #0e1118; 
            color: #e2e8f0; 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            padding: 12px;
            -webkit-tap-highlight-color: transparent;
        }
        main { max-width: 480px; margin: 0 auto; display: flex; flex-direction: column; gap: 12px; }
        h1 { font-size: 20px; text-align: center; color: #f1f5f9; font-weight: 700; margin: 5px 0; }
        .controls-card {
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 12px;
            padding: 12px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .input-row { display: flex; gap: 8px; width: 100%; }
        input { 
            flex: 1; background: #0f172a; border: 1px solid #334155; color: #fff; 
            padding: 12px; border-radius: 8px; font-size: 16px; font-weight: 600;
            text-transform: uppercase; outline: none; text-align: center;
        }
        .btn-action { 
            background: #2563eb; color: #fff; border: none; padding: 12px 24px; 
            border-radius: 8px; font-size: 16px; font-weight: 700; cursor: pointer;
        }
        .draw-row { display: flex; gap: 8px; width: 100%; }
        .draw-btn {
            flex: 1; background: #334155; color: #f1f5f9; border: 1px solid #475569;
            padding: 8px; border-radius: 6px; font-size: 13px; font-weight: 600; cursor: pointer;
        }
        .canvas-card { background: #1e293b; border: 1px solid #334155; border-radius: 12px; padding: 8px; }
        .canvas-container { position: relative; width: 100%; height: 240px; background: #0f172a; border-radius: 8px; overflow: hidden; }
        canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }
        .card { background: #1e293b; border: 1px solid #334155; border-radius: 12px; padding: 14px; }
        .card-title { font-size: 12px; color: #94a3b8; font-weight: 700; text-transform: uppercase; margin-bottom: 6px; }
        .score { font-size: 38px; font-weight: 800; text-align: center; color: #10b981; }
        .reason-box { background: #0f172a; padding: 12px; border-radius: 8px; font-size: 13px; line-height: 1.5; color: #cbd5e1; border-left: 4px solid #3b82f6; min-height: 50px; }
        .card-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
        .metric { background: #0f172a; padding: 10px; border-radius: 8px; border: 1px solid #233044; }
        .metric-label { font-size: 11px; color: #64748b; font-weight: 600; }
        .metric-value { font-size: 14px; font-weight: 700; color: #f1f5f9; margin-top: 2px; }
    </style>
</head>
<body>
<main>
    <h1>Global AI Borsa</h1>
    
    <div class="controls-card">
        <div class="input-row">
            <input type="text" id="symbol" value="BTC" placeholder="BTC, ETH...">
            <button class="btn-action" id="scanBtn">Analiz Et</button>
        </div>
        <div class="draw-row">
            <button class="draw-btn" id="toggleDrawBtn">Çizim Modu: KAPALI</button>
            <button class="draw-btn" id="clearDrawBtn">Temizle</button>
        </div>
    </div>

    <div class="card">
        <div class="card-title">Yapay Zeka Skor</div>
        <div class="score" id="score">%--</div>
    </div>

    <div class="canvas-card">
        <div class="canvas-container">
            <canvas id="chart"></canvas>
            <canvas id="drawLayer"></canvas>
        </div>
    </div>

    <div class="card">
        <div class="card-title">🤖 Yapay Zeka Gerekçe Kutusu</div>
        <div class="reason-box" id="aiNewsReason">Analiz butonuna basarak verileri çekebilirsiniz...</div>
    </div>

    <div class="card-grid">
        <div class="metric"><div class="metric-label">Sinyal</div><div class="metric-value" id="signal">-</div></div>
        <div class="metric"><div class="metric-label">Son Fiyat</div><div class="metric-value" id="price">-</div></div>
        <div class="metric"><div class="metric-label">Giriş Bölgesi</div><div class="metric-value" id="entry">-</div></div>
        <div class="metric"><div class="metric-label">Zarar Kes (Stop)</div><div class="metric-value" id="stop">-</div></div>
        <div class="metric"><div class="metric-label">Destek (Kar Al)</div><div class="metric-value" id="support">-</div></div>
        <div class="metric"><div class="metric-label">Direnç Seviyesi</div><div class="metric-value" id="resistance">-</div></div>
    </div>
</main>
<script>
    const $ = id => document.getElementById(id);
    let globalChartData = [];
    let isDrawingMode = false;
    let isDrawing = false;
    let startX, startY;

    const chartCanvas = $("chart");
    const drawCanvas = $("drawLayer");
    const ctx = chartCanvas.getContext("2d");
    const dCtx = drawCanvas.getContext("2d");

    function resizeCanvas() {
        const container = chartCanvas.parentElement;
        chartCanvas.width = container.clientWidth;
        chartCanvas.height = container.clientHeight;
        drawCanvas.width = container.clientWidth;
        drawCanvas.height = container.clientHeight;
        if(globalChartData.length > 0) drawBinanceCandles(globalChartData);
    }
    window.addEventListener('resize', resizeCanvas);
    setTimeout(resizeCanvas, 200);

    function show(x){
        $("score").textContent = "%85";
        $("signal").textContent = "AL (BOĞA)";
        $("price").textContent = "$" + parseFloat(x.current_price).toLocaleString();
        $("entry").textContent = "$" + parseFloat(x.current_price).toLocaleString();
        $("stop").textContent = "$" + parseFloat(x.stop_level).toLocaleString();
        $("support").textContent = "$" + parseFloat(x.target_level).toLocaleString();
        $("resistance").textContent = "$" + (x.current_price * 1.02).toLocaleString(undefined, {maximumFractionDigits:2});
        if(x.ai_justification) $("aiNewsReason").textContent = x.ai_justification;
    }

    function drawBinanceCandles(data){
        ctx.clearRect(0, 0, chartCanvas.width, chartCanvas.height);
        if (!data || data.length === 0) return;
        globalChartData = data;
        const highs = data.map(d => parseFloat(d[2]));
        const lows = data.map(d => parseFloat(d[3]));
        const maxPrice = Math.max(...highs);
        const minPrice = Math.min(...lows);
        const priceRange = maxPrice - minPrice;
        const candleWidth = (chartCanvas.width / data.length) * 0.65;
        const spacing = (chartCanvas.width / data.length);

        data.forEach((d, i) => {
            const x = i * spacing + (spacing - candleWidth) / 2;
            const openPrice = parseFloat(d[1]);
            const closePrice = parseFloat(d[4]);
            const highPrice = parseFloat(d[2]);
            const lowPrice = parseFloat(d[3]);
            const yOpen = chartCanvas.height - ((openPrice - minPrice) / priceRange) * chartCanvas.height;
            const yClose = chartCanvas.height - ((closePrice - minPrice) / priceRange) * chartCanvas.height;
            const yHigh = chartCanvas.height - ((highPrice - minPrice) / priceRange) * chartCanvas.height;
            const yLow = chartCanvas.height - ((lowPrice - minPrice) / priceRange) * chartCanvas.height;
            const isBullish = closePrice >= openPrice;
            ctx.strokeStyle = isBullish ? "#10b981" : "#ef4444";
            ctx.fillStyle = isBullish ? "#10b981" : "#ef4444";
            ctx.lineWidth = 1.5;
            ctx.beginPath();
            ctx.moveTo(x + candleWidth / 2, yHigh);
            ctx.lineTo(x + candleWidth / 2, yLow);
            ctx.stroke();
            ctx.fillRect(x, Math.min(yOpen, yClose), candleWidth, Math.abs(yOpen - yClose) || 1);

            if (i === data.length - 3) {
                ctx.fillStyle = "#eab308";
                ctx.font = "bold 11px sans-serif";
                ctx.fillText("▲ AI", x - 5, yHigh - 8);
                ctx.strokeStyle = "#eab308";
                ctx.lineWidth = 1;
                ctx.beginPath();
                ctx.moveTo(x + candleWidth / 2, yLow);
                ctx.lineTo(chartCanvas.width, yLow);
                ctx.stroke();
            }
        });
    }

    $("toggleDrawBtn").onclick = () => {
        isDrawingMode = !isDrawingMode;
        $("toggleDrawBtn").textContent = isDrawingMode ? "Çizim Modu: AÇIK" : "Çizim Modu: KAPALI";
        $("toggleDrawBtn").style.background = isDrawingMode ? "#eab308" : "";
        $("toggleDrawBtn").style.color = isDrawingMode ? "#0f172a" : "";
        drawCanvas.style.pointerEvents = isDrawingMode ? "auto" : "none";
    };
    $("clearDrawBtn").onclick = () => dCtx.clearRect(0, 0, drawCanvas.width, drawCanvas.height);

    function handleStart(clientX, clientY, rect) {
        if (!isDrawingMode) return;
        isDrawing = true;
        startX = clientX - rect.left;
        startY = clientY - rect.top;
    }
    function handleEnd(clientX, clientY, rect) {
        if (!isDrawing || !isDrawingMode) return;
        isDrawing = false;
        dCtx.strokeStyle = "#f3ba2f";
        dCtx.lineWidth = 2;
        dCtx.beginPath();
        dCtx.moveTo(startX, startY);
        dCtx.lineTo(clientX - rect.left, clientY - rect.top);
        dCtx.stroke();
    }

    drawCanvas.onmousedown = (e) => handleStart(e.clientX, e.clientY, drawCanvas.getBoundingClientRect());
    drawCanvas.onmouseup = (e) => handleEnd(e.clientX, e.clientY, drawCanvas.getBoundingClientRect());
    drawCanvas.ontouchstart = (e) => handleStart(e.touches[0].clientX, e.touches[0].clientY, drawCanvas.getBoundingClientRect());
    drawCanvas.ontouchmove = (e) => { if (isDrawing) e.preventDefault(); };
    drawCanvas.ontouchend = (e) => handleEnd(e.changedTouches[0].clientX, e.changedTouches[0].clientY, drawCanvas.getBoundingClientRect());

    async function load(){
        const s = $("symbol").value.trim().toUpperCase() || 'BTC';
        $("scanBtn").textContent = "Giriş...";
        try {
            const r = await fetch(`/chart/${s}`);
            const candles = await r.json();
            const r2 = await fetch(`/signal/${s}`);
            const signalData = await r2.json();
            if(candles && !candles.error) drawBinanceCandles(candles);
            if(signalData && !signalData.error) show(signalData);
        } catch(e) { console.log(e); }
        $("scanBtn").textContent = "Analiz Et";
    }

    window.addEventListener('load', () => {
        $("scanBtn").onclick = load;
        resizeCanvas();
    });
</script>
</body>
</html>
