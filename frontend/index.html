<!doctype html>
<html lang="tr">
<head>
    <meta charset="utf-8">
    <meta name="theme-color" content="#0e1118">
    <title>Global AI Borsa</title>
    <style>
        *{box-sizing:border-box;}
        main{max-width:720px;margin:0 auto;}
        h1{font-size:23px;margin-bottom:15px;text-align:center;}
        .row{display:flex;gap:10px;margin-bottom:15px;}
        .score{font-size:44px;font-weight:bold;text-align:center;}
        .canvas-container{position:relative;width:100%;height:300px;background:#0f172a;border-radius:8px;}
        canvas{position:absolute;top:0;left:0;width:100%;height:100%;}
        .reason-box{background:#1e293b;padding:15px;border-radius:8px;margin-top:10px;min-height:50px;}
        .draw-controls{display:flex;gap:10px;margin-top:10px;}
        .card{background:#1e293b;border-radius:12px;padding:15px;margin-bottom:15px;}
        .card-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;}
        .metric{background:#0f172a;padding:10px;border-radius:8px;}
        .metric-label{font-size:12px;color:#64748b;}
        .metric-value{font-size:16px;font-weight:bold;color:#f1f5f9;margin-top:4px;}
        input{flex:1;background:#1e293b;border:1px solid #334155;color:#fff;padding:12px;border-radius:8px;}
        button{background:#3b82f6;color:#fff;border:none;padding:12px 20px;border-radius:8px;cursor:pointer;font-weight:bold;}
        .muted{color:#64748b;font-size:12px;}
    </style>
</head>
<body>
<main>
    <div class="top"><div><h1>Global AI Borsa</h1></div></div>
    <div class="card">
        <div class="row">
            <input type="text" id="symbol" value="BTC">
            <div class="draw-controls">
                <button class="draw-btn" id="toggleDrawBtn">Çizim Modu</button>
                <button class="draw-btn" id="clearDrawBtn">Temizle</button>
            </div>
        </div>
    </div>

    <div class="card">
        <div class="canvas-container">
            <canvas id="chart"></canvas>
            <canvas id="drawLayer"></canvas>
        </div>
    </div>

    <div class="card">
        <div class="muted">🤖 Yapay Zeka Gerekçe Kutusu</div>
        <div class="reason-box" id="aiNewsReason">Veri bekleniyor...</div>
    </div>

    <div class="card card-grid">
        <div class="metric"><div class="metric-label">Skor</div><div class="metric-value" id="score">%--</div></div>
        <div class="metric"><div class="metric-label">Sinyal</div><div class="metric-value" id="signal">-</div></div>
        <div class="metric"><div class="metric-label">Fiyat</div><div class="metric-value" id="price">-</div></div>
        <div class="metric"><div class="metric-label">Giriş</div><div class="metric-value" id="entry">-</div></div>
        <div class="metric"><div class="metric-label">Stop</div><div class="metric-value" id="stop">-</div></div>
        <div class="metric"><div class="metric-label">Destek</div><div class="metric-value" id="support">-</div></div>
        <div class="metric"><div class="metric-label">Direnç</div><div class="metric-value" id="resistance">-</div></div>
    </div>
</main>

<script src="config.js"></script>
<script>
    const API = window.APP_CONFIG ? window.APP_CONFIG.API_URL : "";
    const $ = id => document.getElementById(id);
    let globalChartData = [];
    let isDrawingMode = false;
    let isDrawing = false;
    let startX, startY;

    function show(x){
        $("score").textContent = "%85";
        $("signal").textContent = "AL (BOĞA)";
        $("price").textContent = x.current_price;
        $("entry").textContent = x.current_price;
        $("stop").textContent = x.stop_level;
        $("support").textContent = x.target_level;
        $("resistance").textContent = (x.current_price * 1.02).toFixed(2);
        if(x.ai_justification) $("aiNewsReason").textContent = x.ai_justification;
    }

    function drawBinanceCandles(data){
        const canvas = $("chart");
        const ctx = canvas.getContext("2d");
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        if (!data || data.length === 0) return;

        globalChartData = data;
        const highs = data.map(d => parseFloat(d[2]));
        const lows = data.map(d => parseFloat(d[3]));
        const maxPrice = Math.max(...highs);
        const minPrice = Math.min(...lows);
        const priceRange = maxPrice - minPrice;

        const candleWidth = (canvas.width / data.length) * 0.7;
        const spacing = (canvas.width / data.length);

        data.forEach((d, i) => {
            const x = i * spacing + (spacing - candleWidth) / 2;
            const yOpen = canvas.height - ((parseFloat(d[1]) - minPrice) / priceRange) * canvas.height;
            const yClose = canvas.height - ((parseFloat(d[4]) - minPrice) / priceRange) * canvas.height;
            const yHigh = canvas.height - ((parseFloat(d[2]) - minPrice) / priceRange) * canvas.height;
            const yLow = canvas.height - ((parseFloat(d[3]) - minPrice) / priceRange) * canvas.height;

            const isBullish = parseFloat(d[4]) >= parseFloat(d[1]);
            ctx.strokeStyle = isBullish ? "#10b981" : "#ef4444";
            ctx.fillStyle = isBullish ? "#10b981" : "#ef4444";
            ctx.lineWidth = 2;

            ctx.beginPath();
            ctx.moveTo(x + candleWidth / 2, yHigh);
            ctx.lineTo(x + candleWidth / 2, yLow);
            ctx.stroke();

            const height = Math.abs(yOpen - yClose) || 1;
            ctx.fillRect(x, Math.min(yOpen, yClose), candleWidth, height);

            // YAPAY ZEKA FORMASYON BELİRTECİ
            if (i === data.length - 2) {
                ctx.fillStyle = "#eab308";
                ctx.font = "bold 11px sans-serif";
                ctx.fillText("▲ AI", x - 5, yHigh - 12);
                
                ctx.strokeStyle = "#eab308";
                ctx.setLineDash([4, 4]);
                ctx.beginPath();
                ctx.moveTo(x + candleWidth / 2, yLow);
                ctx.lineTo(canvas.width, yLow);
                ctx.stroke();
                ctx.setLineDash([]);
            }
        });
    }

    const drawCanvas = $("drawLayer");
    const dCtx = drawCanvas.getContext("2d");

    $("toggleDrawBtn").onclick = () => {
        isDrawingMode = !isDrawingMode;
        $("toggleDrawBtn").textContent = isDrawingMode ? "Çizim Modu: AÇIK" : "Çizim Modu";
        $("toggleDrawBtn").style.background = isDrawingMode ? "#eab308" : "";
        drawCanvas.style.pointerEvents = isDrawingMode ? "auto" : "none";
    };

    $("clearDrawBtn").onclick = () => {
        dCtx.clearRect(0, 0, drawCanvas.width, drawCanvas.height);
    };

    drawCanvas.onmousedown = (e) => {
        if (!isDrawingMode) return;
        isDrawing = true;
        const rect = drawCanvas.getBoundingClientRect();
        startX = e.clientX - rect.left;
        startY = e.clientY - rect.top;
    };

    drawCanvas.onmousemove = (e) => {
        if (!isDrawing || !isDrawingMode) return;
    };

    drawCanvas.onmouseup = (e) => {
        if (!isDrawing || !isDrawingMode) return;
        isDrawing = false;
        const rect = drawCanvas.getBoundingClientRect();
        const endX = e.clientX - rect.left;
        const endY = e.clientY - rect.top;

        dCtx.strokeStyle = "#f3ba2f";
        dCtx.lineWidth = 2;
        dCtx.beginPath();
        dCtx.moveTo(startX, startY);
        dCtx.lineTo(endX, endY);
        dCtx.stroke();
    };

    drawCanvas.ontouchstart = (e) => {
        if (!isDrawingMode) return;
        isDrawing = true;
        const rect = drawCanvas.getBoundingClientRect();
        startX = e.touches[0].clientX - rect.left;
        startY = e.touches[0].clientY - rect.top;
    };
    drawCanvas.ontouchmove = (e) => { if (isDrawing) e.preventDefault(); };
    drawCanvas.ontouchend = (e) => {
        if (!isDrawing || !isDrawingMode) return;
        isDrawing = false;
        const rect = drawCanvas.getBoundingClientRect();
        const endX = e.changedTouches[0].clientX - rect.left;
        const endY = e.changedTouches[0].clientY - rect.top;
        dCtx.strokeStyle = "#f3ba2f";
        dCtx.lineWidth = 2;
        dCtx.beginPath();
        dCtx.moveTo(startX, startY);
        dCtx.lineTo(endX, endY);
        dCtx.stroke();
    };

    // VERCEL ÇATISI ALTINDA HIZLI VE SUNUCUSUZ DOĞRUDAN VERİ YÜKLEME FONKSİYONU
    async function load(){
        const s = $("symbol").value.trim().toUpperCase() || 'BTC';
        const scanBtn = document.querySelector("button:not(.draw-btn)");
        if (scanBtn) scanBtn.textContent = "Hesaplanıyor...";
        try {
            // Harici bir URL aramadan doğrudan Vercel backend rotalarına bağlanır
            const r = await fetch(`/chart/${s}`);
            const candles = await r.json();
            
            const r2 = await fetch(`/signal/${s}`);
            const signalData = await r2.json();
            
            if(candles && !candles.error) {
                drawBinanceCandles(candles);
            }
            if(signalData && !signalData.error) {
                show(signalData);
            }
        } catch(e) {
            console.log(e);
        }
        if (scanBtn) scanBtn.textContent = "Analiz Et";
    }

    // Orijinal tetikleyici butonunuzu bulup yükleme fonksiyonunu bağlar
    window.addEventListener('load', () => {
        const scanBtn = document.querySelector("button:not(.draw-btn)");
        if (scanBtn) scanBtn.onclick = load;
        
        const chartCanvas = $("chart");
        const rect = chartCanvas.parentElement.getBoundingClientRect();
        chartCanvas.width = rect.width;
        chartCanvas.height = rect.height;
        drawCanvas.width = rect.width;
        drawCanvas.height = rect.height;
    });
</script>
</body>
</html>
