<!doctype html>
<html lang="tr">
<head>
    <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#0b0d12">
    <title>Global AI Borsa</title>
    <style>
        *{box-sizing:border-box}body{margin:0;background:#0b0d12;color:#fff;font-family:sans-serif}
        main{max-width:720px;margin:auto;padding:14px;display:flex;flex-direction:column;gap:14px}
        h1{font-size:23px;margin:8px 0}.muted{color:#8a8d98;font-size:13px}
        .row{display:flex;gap:8px}.row>*{flex:1}input{background:#161922;border:1px solid #262a36;padding:12px;color:#fff;border-radius:8px;font-size:15px;outline:none}
        .score{font-size:44px;font-weight:800}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
        canvas{width:100%;height:270px;background:#161922;border-radius:12px;border:1px solid #262a36}
    </style></head><body><main>
    <div class="top"><div><h1>Global AI Borsa</h1><div class="muted">Gerçek veri • Al sinyal motoru</div></div></div>
    <div class="card"><div class="row"><input id="symbol" value="BTC"><input type="button" id="scanBtn" value="Analiz Et" style="background:#2563eb;border:none;color:#fff;font-weight:bold;cursor:pointer;border-radius:8px"></div></div>
    <div class="card"><div class="muted">AI SCORE</div><div class="score" id="score">-</div><div id="signal" style="font-weight:bold;margin-top:4px">-</div></div>
    <div class="card"><div class="muted">Anlık Durum ve Seviyeler</div><div id="confidence" style="margin-top:4px;font-weight:bold;color:#10b981">-</div></div>
    <div class="card grid">
        <div class="metric"><span class="muted">Fiyat:</span> <span id="price">-</span></div>
        <div class="metric"><span class="muted">Giriş Seviyesi:</span> <span id="entry">-</span></div>
        <div class="metric"><span class="muted">Stop Seviyesi:</span> <span id="stop">-</span></div>
        <div class="metric"><span class="muted">Destek:</span> <span id="support">-</span></div>
        <div class="metric"><span class="muted">Direnç:</span> <span id="resistance">-</span></div>
        <div class="metric"><span class="muted">Hedef 1:</span> <span id="t1">-</span></div>
        <div class="metric"><span class="muted">Hedef 2:</span> <span id="t2">-</span></div>
    </div>
    <canvas id="chart"></canvas>
    <div class="card"><div class="muted">NEDEN BU SKOR?</div><ul id="reasons" style="padding-left:20px;margin:8px 0;line-height:1.6"></ul></div>
</main>
<script src="config.js"></script>
<script>
const API = window.APP_CONFIG.API_BASE_URL;
const $ = id => document.getElementById(id);
async function get(p){const r=await fetch(API+p);return r.ok?r.json():null}

function show(x){
    $("score").textContent=x.score??"-";
    $("signal").textContent=x.action??"-";
    $("confidence").textContent="Güven: "+(x.confidence??0)+"%";
    $("price").textContent=x.price??"-";
    $("entry").textContent=x.entry_range??"-";
    $("stop").textContent=x.stop??"-";
    $("support").textContent=x.support??"-";
    $("resistance").textContent=x.resistance??"-";
    $("t1").textContent=x.targets?.[0]??"-";
    $("t2").textContent=x.targets?.[1]??"-";
    $("reasons").innerHTML=(x.reasons||[]).map(r=>`<li>${r}</li>`).join("");
}

function draw(candles, levels){
    const canvas = $("chart");
    const ctx = canvas.getContext("2d");
    ctx.clearRect(0,0,canvas.width,canvas.height);
    if(!candles||candles.length===0) return;
    
    const closes = candles.map(c => c.close);
    const min = Math.min(...closes);
    const max = Math.max(...closes);
    const range = max - min || 1;
    
    ctx.beginPath();
    ctx.strokeStyle = "#2563eb";
    ctx.lineWidth = 3;
    
    candles.forEach((c, i) => {
        const x = (i / (candles.length - 1)) * canvas.width;
        const y = canvas.height - ((c.close - min) / range) * canvas.height * 0.8 - canvas.height * 0.1;
        if(i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    });
    ctx.stroke();
    
    if(levels && levels.support){
        ctx.setLineDash([5, 5]);
        ctx.strokeStyle = "#10b981";
        const sy = canvas.height - ((levels.support - min) / range) * canvas.height * 0.8 - canvas.height * 0.1;
        ctx.beginPath(); ctx.moveTo(0, sy); ctx.lineTo(canvas.width, sy); ctx.stroke();
    }
    if(levels && levels.resistance){
        ctx.setLineDash([5, 5]);
        ctx.strokeStyle = "#ef4444";
        const ry = canvas.height - ((levels.resistance - min) / range) * canvas.height * 0.8 - canvas.height * 0.1;
        ctx.beginPath(); ctx.moveTo(0, ry); ctx.lineTo(canvas.width, ry); ctx.stroke();
    }
    ctx.setLineDash([]);
}
async function load(){
    const s=$("symbol").value.trim();
    $("scanBtn").value="Hesaplanıyor...";
    try{
        const [x, ch]=await Promise.all([get("/signal/"+s), get("/chart/"+s)]);
        if(x) { show(x); if(ch) draw(ch, x); }
    }catch(e){}
    $("scanBtn").value="Analiz Et";
}
$("scanBtn").onclick=load;
</script></body></html>
